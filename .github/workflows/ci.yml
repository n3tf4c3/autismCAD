name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.7.0

      - name: Install
        run: npm ci

      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Guardrails
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' "as never" apps/web/src; then
            echo "Found forbidden 'as never' cast in apps/web/src/"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Drizzle Check
        # drizzle-kit check e offline (compara snapshots, nao conecta). Como o achado 107
        # fez o config falhar sem DATABASE_URL, usamos o opt-in de sandbox documentado.
        env:
          DB_LOCAL_FALLBACK: "1"
        run: npm run db:check -w @autismcad/db

      - name: Build
        run: npm run build

      # O drift de patch do Expo nao pode mascarar as checagens do web: este passo roda
      # por ultimo para que Lint/Typecheck/Tests/Build sempre tenham rodado antes dele.
      - name: Mobile compatibility
        env:
          EXPO_NO_DOTENV: "1"
        run: |
          npm run check:dependencies -w @autismcad/mobile
          npm run doctor -w @autismcad/mobile
