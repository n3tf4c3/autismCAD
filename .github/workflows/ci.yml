name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Mobile compatibility
        env:
          EXPO_NO_DOTENV: "1"
        run: |
          npm run check:dependencies -w @autismcad/mobile
          npm run doctor -w @autismcad/mobile

      - name: Lint
        run: npm run lint

      - name: Guardrails
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' "as never" apps/web/src; then
            echo "Found forbidden 'as never' cast in apps/web/src/"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Drizzle Check
        # drizzle-kit check e offline (compara snapshots, nao conecta). Como o achado 107
        # fez o config falhar sem DATABASE_URL, usamos o opt-in de sandbox documentado.
        env:
          DB_LOCAL_FALLBACK: "1"
        run: npm run db:check -w @autismcad/db

      - name: Build
        run: npm run build
